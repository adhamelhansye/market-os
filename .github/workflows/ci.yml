name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (lint + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marketingos
          POSTGRES_PASSWORD: marketingos_ci
          POSTGRES_DB: marketingos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketingos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        working-directory: apps/api
        run: uv pip install -e ".[dev]"
      - name: Lint (ruff)
        working-directory: apps/api
        run: ruff check src tests
      - name: Run tests
        working-directory: apps/api
        env:
          APP_ENV: test
          JWT_SECRET: ci-jwt-secret-for-tests-123456
          JWT_REFRESH_SECRET: ci-refresh-secret-98765
          ENCRYPTION_KEY: ci-encryption-key
          TEST_DATABASE_URL: postgresql+asyncpg://marketingos:marketingos_ci@localhost:5432/marketingos_test
          TEST_REDIS_URL: redis://localhost:6379/15
        run: pytest tests/ -v

  web:
    name: Web (lint + typecheck + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (vitest)
        working-directory: apps/web
        run: npm run test
      - name: Build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build